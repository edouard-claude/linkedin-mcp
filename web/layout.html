{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 2.5rem 1.25rem;
    display: flex; justify-content: center;
    background: Canvas; color: CanvasText;
  }
  main { max-width: 34rem; width: 100%; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
  p, li { margin: .6rem 0; }
  .btn {
    display: inline-block; margin: 1.5rem 0 .5rem;
    padding: .75rem 1.25rem; border-radius: .5rem;
    background: #1877f2; color: #fff; text-decoration: none; font-weight: 600;
  }
  .btn:hover { background: #145dbf; }
  .muted { opacity: .7; font-size: .875rem; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: color-mix(in srgb, CanvasText 10%, transparent);
    padding: .1rem .35rem; border-radius: .25rem;
  }
</style>
</head>
<body><main>{{template "content" .}}</main></body>
</html>{{end}}
